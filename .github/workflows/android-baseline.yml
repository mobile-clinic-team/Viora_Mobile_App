name: Android baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-36"
      - name: Validate Gradle wrapper
        run: ./gradlew --version
      - name: Lint, unit test, and assemble devDebug
        run: ./gradlew :app:lintDevDebug :app:testDevDebugUnitTest :app:assembleDevDebug --no-daemon
